<svg viewBox="0 0 860 560" width="860" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif" role="img">
  <title>Pseudonymisierung am MCP-Server – Datenschutz-Überblick</title>
  <desc>Eine horizontale Achse zeigt den Datenfluss Moodle, MCP-Server und Cloud. Auf dem Hinweg (blau) wird der Klarname durch ein Pseudonym ersetzt, bevor die Datenschutz-Grenze zur Cloud überschritten wird. Auf dem Rückweg (lila) setzt der Server lokal wieder den Klarnamen ein. Die Zuordnungsliste (bernstein) bleibt ausschließlich lokal.</desc>

  <rect x="0" y="0" width="860" height="560" fill="#ffffff"/>

  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Wie der Schutz personenbezogener Daten funktioniert</text>
  <text x="430" y="55" text-anchor="middle" font-size="12.5" fill="#475569">Klarnamen bleiben im Verantwortungsbereich der Schule – die Cloud sieht nur Pseudonyme</text>

  <!-- Zones -->
  <rect x="20" y="78" width="470" height="452" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="560" y="78" width="280" height="452" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="255" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">SCHULE · ausschließlich lokal</text>
  <text x="255" y="121" text-anchor="middle" font-size="10.5" fill="#16a34a">unter alleiniger Kontrolle der Schule</text>
  <text x="700" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">KI-DIENST · Cloud</text>
  <text x="700" y="121" text-anchor="middle" font-size="10.5" fill="#3b82f6">externer Anbieter (z. B. Claude)</text>

  <!-- Datenschutz-Grenze -->
  <line x1="525" y1="90" x2="525" y2="518" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8,5"/>
  <g transform="rotate(-90,525,400)">
    <text x="525" y="395" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dc2626">DATENSCHUTZ-GRENZE</text>
    <text x="525" y="409" text-anchor="middle" font-size="9" fill="#ef4444">kein Klarname überschreitet diese Linie</text>
  </g>

  <!-- ===== Top axis boxes ===== -->
  <!-- Moodle -->
  <rect x="44" y="150" width="150" height="94" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <text x="119" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Moodle</text>
  <text x="119" y="207" text-anchor="middle" font-size="10" fill="#334155">echte Daten:</text>
  <text x="119" y="224" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">„Max Mustermann“</text>

  <!-- MCP -->
  <rect x="308" y="150" width="160" height="94" rx="9" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
  <text x="388" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">MCP-Server der Schule</text>
  <line x1="324" y1="186" x2="452" y2="186" stroke="#e2e8f0" stroke-width="1"/>
  <text x="388" y="205" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d">ersetzt Namen durch</text>
  <text x="388" y="220" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d">Pseudonym (und zurück)</text>
  <text x="388" y="236" text-anchor="middle" font-size="9" fill="#64748b">die „Schleuse“ vor der Cloud</text>

  <!-- Cloud -->
  <rect x="600" y="150" width="222" height="94" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="711" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">KI-Modell (Cloud)</text>
  <line x1="616" y1="186" x2="806" y2="186" stroke="#e2e8f0" stroke-width="1"/>
  <text x="711" y="205" text-anchor="middle" font-size="10" fill="#475569">sieht ausschließlich:</text>
  <text x="711" y="223" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">S-0001, S-0002 …</text>
  <text x="711" y="238" text-anchor="middle" font-size="9" fill="#64748b">keine Klarnamen, keine E-Mails</text>

  <!-- ===== Hinweg (blau, y=180) ===== -->
  <line x1="194" y1="180" x2="304" y2="180" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="249" y="173" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1d4ed8">Klarname</text>
  <line x1="468" y1="180" x2="596" y2="180" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="534" y="173" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">„S-0001“</text>

  <!-- ===== Rückweg (lila, y=214) ===== -->
  <line x1="304" y1="214" x2="198" y2="214" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ap)"/>
  <text x="249" y="230" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7c3aed">→ „Max Mustermann“</text>
  <line x1="600" y1="214" x2="472" y2="214" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ap)"/>
  <text x="534" y="230" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7c3aed">Antwort zu „S-0001“</text>

  <!-- ===== Zuordnung (bernstein, vertikal) ===== -->
  <line x1="388" y1="244" x2="388" y2="300" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#aa)"/>
  <text x="398" y="276" font-size="8.5" fill="#b45309">nachschlagen</text>

  <!-- Vault -->
  <rect x="300" y="300" width="176" height="86" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <rect x="378" y="320" width="20" height="16" rx="2" fill="#92400e"/>
  <path d="M 381 320 v-5 a7 7 0 0 1 14 0 v5" fill="none" stroke="#92400e" stroke-width="2.4"/>
  <text x="388" y="354" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">Zuordnungsliste</text>
  <text x="388" y="370" text-anchor="middle" font-size="10" fill="#78350f">Max Mustermann = S-0001</text>
  <text x="388" y="382" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">verlässt die Schule nie</text>

  <!-- Right mirror box -->
  <rect x="584" y="300" width="234" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="701" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Ohne die Zuordnungsliste</text>
  <text x="701" y="344" text-anchor="middle" font-size="10" fill="#475569">ist „S-0001“ für den Anbieter</text>
  <text x="701" y="360" text-anchor="middle" font-size="10" fill="#475569">keiner Person zuzuordnen</text>
  <text x="701" y="378" text-anchor="middle" font-size="9.5" font-style="italic" fill="#64748b">— praktisch anonym —</text>

  <!-- ===== Legends ===== -->
  <rect x="40" y="406" width="430" height="112" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="56" y="428" font-size="11.5" font-weight="700" fill="#0f172a">Ablauf in drei Schritten</text>
  <rect x="56" y="440" width="11" height="11" rx="2" fill="#1d4ed8"/>
  <text x="74" y="450" font-size="10.5" fill="#334155"><tspan font-weight="600">Hinweg:</tspan> Klarname wird vor dem Versand durch Pseudonym ersetzt</text>
  <rect x="56" y="463" width="11" height="11" rx="2" fill="#7c3aed"/>
  <text x="74" y="473" font-size="10.5" fill="#334155"><tspan font-weight="600">Rückweg:</tspan> Pseudonym wird lokal wieder zum echten Namen</text>
  <rect x="56" y="486" width="11" height="11" rx="2" fill="#d97706"/>
  <text x="74" y="496" font-size="10.5" fill="#334155"><tspan font-weight="600">Zuordnung:</tspan> Liste Name = Pseudonym verlässt die Schule nie</text>

  <rect x="576" y="406" width="250" height="112" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="592" y="428" font-size="11.5" font-weight="700" fill="#0f172a">Rechtlicher Kern</text>
  <text x="592" y="450" font-size="10" fill="#334155">Pseudonymisierung i. S. v.</text>
  <text x="592" y="465" font-size="10.5" font-weight="700" fill="#0f172a">Art. 4 Nr. 5 DSGVO</text>
  <text x="592" y="485" font-size="10" fill="#334155">Datenminimierung – Art. 5 Abs. 1 c</text>
  <text x="592" y="501" font-size="10" fill="#334155">techn. Maßnahme – Art. 32 DSGVO</text>

  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5Z" fill="#1d4ed8"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5Z" fill="#7c3aed"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5Z" fill="#d97706"/></marker>
  </defs>
</svg>