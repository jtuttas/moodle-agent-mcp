<svg viewBox="0 0 800 430" width="800" height="430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" role="img">
  <title>Pseudonymisierung Datenfluss – Swimlane-Diagramm</title>
  <desc>Drei horizontale Spuren zeigen Hinweg, Rückweg und Datei-Rehydrierung. Eine vertikale Trennlinie teilt lokale Zone (links) von Cloud (rechts).</desc>
  <defs>
    <marker id="arR" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5Z" fill="#4f81e8"/></marker>
    <marker id="arO" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5Z" fill="#f97316"/></marker>
    <marker id="arG" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5Z" fill="#16a34a"/></marker>
    <marker id="arP" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5Z" fill="#7c3aed"/></marker>
    <marker id="arLeft" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto"><path d="M7,0 L7,7 L0,3.5Z" fill="#db2777"/></marker>
    <marker id="arLeftB" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto"><path d="M7,0 L7,7 L0,3.5Z" fill="#4f81e8"/></marker>
  </defs>

  <!-- Zone backgrounds -->
  <rect x="0" y="0" width="800" height="430" fill="#f8fafc" rx="10"/>
  <rect x="512" y="44" width="288" height="386" fill="#eff6ff"/>

  <!-- Row dividers -->
  <line x1="0" y1="110" x2="800" y2="110" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="230" x2="800" y2="230" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="340" x2="800" y2="340" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Zone headers -->
  <rect x="0" y="0" width="512" height="44" fill="#f1f5f9" rx="10"/>
  <rect x="512" y="0" width="288" height="44" fill="#dbeafe" rx="10"/>
  <text x="256" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">LOKAL · Schule / Lehrkraft</text>
  <text x="256" y="39" text-anchor="middle" font-size="9.5" fill="#64748b">Moodle · MCP-Server · Dateien</text>
  <text x="656" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">CLOUD · KI-Modell</text>
  <text x="656" y="39" text-anchor="middle" font-size="9.5" fill="#3b82f6">Claude · GPT · …</text>

  <!-- Divider line -->
  <line x1="512" y1="44" x2="512" y2="410" stroke="#93c5fd" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="512" y="424" text-anchor="middle" font-size="8.5" fill="#93c5fd">▲ Klarnamen passieren diese Linie nie ▲</text>

  <!-- ══════════════════════════════════
       ROW 1 — HINWEG
       ══════════════════════════════════ -->
  <rect x="2" y="110" width="94" height="120" fill="#fff7ed" rx="6"/>
  <text x="49" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c" transform="rotate(-90,49,168)">① Hinweg</text>

  <rect x="106" y="126" width="94" height="52" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="153" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">Moodle</text>
  <text x="153" y="163" text-anchor="middle" font-size="9" fill="#9a3412">Klardaten</text>
  <line x1="200" y1="152" x2="224" y2="152" stroke="#f97316" stroke-width="2" marker-end="url(#arO)"/>

  <rect x="226" y="117" width="174" height="70" rx="7" fill="#e0f2fe" stroke="#4f81e8" stroke-width="1.8"/>
  <text x="313" y="138" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">① harvestIdentities</text>
  <line x1="250" y1="147" x2="376" y2="147" stroke="#e2e8f0" stroke-width="1"/>
  <text x="313" y="164" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">② redactResult</text>
  <rect x="248" y="191" width="130" height="22" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
  <text x="313" y="206" text-anchor="middle" font-size="9" fill="#854d0e">📄 pseudonym-map.json</text>
  <line x1="313" y1="187" x2="313" y2="191" stroke="#eab308" stroke-width="1.2"/>

  <line x1="400" y1="152" x2="506" y2="152" stroke="#4f81e8" stroke-width="2" marker-end="url(#arR)"/>
  <text x="452" y="146" text-anchor="middle" font-size="8.5" fill="#4f81e8">pseudonymisiert</text>

  <rect x="520" y="117" width="266" height="70" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="653" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">KI sieht nur:</text>
  <text x="653" y="159" text-anchor="middle" font-size="10" fill="#1d4ed8">S-0001, S-0002 … (keine Klarnamen)</text>
  <text x="653" y="174" text-anchor="middle" font-size="9" fill="#3b82f6">userids (lokal nicht auflösbar)</text>

  <!-- ══════════════════════════════════
       ROW 2 — RÜCKWEG
       ══════════════════════════════════ -->
  <rect x="2" y="230" width="94" height="110" fill="#fdf2f8" rx="6"/>
  <text x="49" y="288" text-anchor="middle" font-size="10" font-weight="700" fill="#9d174d" transform="rotate(-90,49,288)">② Rückweg</text>

  <rect x="520" y="244" width="266" height="56" rx="7" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="653" y="266" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9d174d">Anweisung mit Pseudonym</text>
  <text x="653" y="283" text-anchor="middle" font-size="9.5" fill="#be185d">„Hallo S-0002, deine Note ist …"</text>

  <line x1="506" y1="272" x2="410" y2="272" stroke="#db2777" stroke-width="2" marker-end="url(#arLeft)"/>
  <text x="456" y="266" text-anchor="middle" font-size="8.5" fill="#db2777">mit Pseudonym</text>

  <rect x="226" y="244" width="174" height="46" rx="7" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/>
  <text x="313" y="264" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9d174d">③ rehydrateText</text>
  <text x="313" y="281" text-anchor="middle" font-size="9" fill="#be185d">S-0002 → Max B.</text>
  <rect x="248" y="294" width="130" height="22" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
  <text x="313" y="309" text-anchor="middle" font-size="9" fill="#854d0e">📄 pseudonym-map.json</text>
  <line x1="313" y1="290" x2="313" y2="294" stroke="#eab308" stroke-width="1.2"/>

  <line x1="226" y1="267" x2="202" y2="267" stroke="#db2777" stroke-width="2" marker-end="url(#arLeft)"/>

  <rect x="106" y="244" width="94" height="52" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="153" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">Moodle</text>
  <text x="153" y="280" text-anchor="middle" font-size="9" fill="#9a3412">Klarname</text>

  <!-- ══════════════════════════════════
       ROW 3 — DATEI-REHYDRIERUNG
       ══════════════════════════════════ -->
  <rect x="2" y="340" width="94" height="86" fill="#f5f3ff" rx="6"/>
  <text x="49" y="387" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9" transform="rotate(-90,49,387)">③ Datei</text>

  <rect x="106" y="353" width="100" height="46" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="156" y="372" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b21b6">Bericht.docx</text>
  <text x="156" y="387" text-anchor="middle" font-size="9" fill="#7c3aed">S-0001, S-0002</text>
  <line x1="206" y1="376" x2="224" y2="376" stroke="#7c3aed" stroke-width="2" marker-end="url(#arP)"/>

  <rect x="226" y="348" width="150" height="46" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="301" y="368" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b21b6">④ rehydrateFile</text>
  <text x="301" y="383" text-anchor="middle" font-size="9" fill="#7c3aed">.md / .txt / .docx</text>
  <rect x="248" y="398" width="130" height="22" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
  <text x="313" y="413" text-anchor="middle" font-size="9" fill="#854d0e">📄 pseudonym-map.json</text>
  <line x1="313" y1="394" x2="313" y2="398" stroke="#eab308" stroke-width="1.2"/>

  <line x1="376" y1="371" x2="394" y2="371" stroke="#16a34a" stroke-width="2" marker-end="url(#arG)"/>
  <rect x="396" y="353" width="108" height="46" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="450" y="372" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d">Bericht_klar</text>
  <text x="450" y="387" text-anchor="middle" font-size="9" fill="#16a34a">bleibt lokal ✓</text>

  <line x1="504" y1="371" x2="518" y2="371" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arR)"/>

  <rect x="520" y="353" width="266" height="46" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="653" y="373" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">nur Metadaten</text>
  <text x="653" y="389" text-anchor="middle" font-size="9" fill="#64748b">{ ok, pseudonyme_ersetzt, schueler[] }</text>
</svg>
