<svg viewBox="0 0 820 580" width="820" height="580" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#4f81e8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#f97316"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#43a047"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#9ca3af"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="820" height="580" fill="#f0f4f8" rx="12"/>

  <!-- Titel -->
  <text x="410" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Pseudonymisierung im MCP-Server – Datenfluss</text>

  <!-- ═══════════════════════════════════════════════════════
       LOKALE ZONE
       ═══════════════════════════════════════════════════════ -->
  <rect x="14" y="48" width="516" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="26" y="66" font-size="10.5" fill="#64748b" font-weight="600">LOKAL (Schule / Lehrkraft)</text>

  <!-- ═══════════════════════════════════════════════════════
       CLOUD ZONE
       ═══════════════════════════════════════════════════════ -->
  <rect x="548" y="48" width="258" height="244" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="560" y="66" font-size="10.5" fill="#3b82f6" font-weight="600">CLOUD (KI-Modell)</text>

  <!-- ═══════════════════════════════════════════════════════
       MOODLE BOX
       ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="80" width="148" height="70" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <text x="104" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">Moodle</text>
  <text x="104" y="118" text-anchor="middle" font-size="10" fill="#9a3412">(lokale Instanz)</text>
  <text x="104" y="134" text-anchor="middle" font-size="9.5" fill="#7c2d12">Klarnamen · E-Mails · IDs</text>

  <!-- ═══════════════════════════════════════════════════════
       MCP-SERVER BOX
       ═══════════════════════════════════════════════════════ -->
  <rect x="182" y="74" width="328" height="464" rx="10" fill="#f0f9ff" stroke="#4f81e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="346" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">MCP-Server</text>
  <text x="346" y="111" text-anchor="middle" font-size="10" fill="#3b82f6">(lokaler Prozess)</text>

  <!-- harvestIdentities -->
  <rect x="198" y="122" width="294" height="54" rx="7" fill="#fff3e0" stroke="#f97316" stroke-width="1.5"/>
  <text x="345" y="143" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c2410c">harvestIdentities(data)</text>
  <text x="345" y="159" text-anchor="middle" font-size="9.5" fill="#9a3412">lernt Personen-Daten → vergibt stabile Pseudonyme (S-0001 …)</text>

  <!-- redactResult -->
  <rect x="198" y="190" width="294" height="54" rx="7" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="345" y="211" text-anchor="middle" font-size="11.5" font-weight="600" fill="#15803d">redactResult(result)</text>
  <text x="345" y="227" text-anchor="middle" font-size="9.5" fill="#166534">ersetzt alle Klarnamen durch Pseudonyme in der Antwort</text>

  <!-- rehydrateText -->
  <rect x="198" y="290" width="294" height="54" rx="7" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="345" y="311" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9d174d">rehydrateText(text)</text>
  <text x="345" y="327" text-anchor="middle" font-size="9.5" fill="#831843">ersetzt Pseudonyme in ausgehenden Texten durch Klarnamen</text>

  <!-- Trennlinie Hinweg / Rückweg -->
  <line x1="198" y1="262" x2="492" y2="262" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="345" y="275" text-anchor="middle" font-size="9" fill="#94a3b8">── Rückweg (Modell → Tool → Moodle) ──</text>

  <!-- moodle_rehydrate_report -->
  <rect x="198" y="390" width="294" height="70" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="345" y="411" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6d28d9">moodle_rehydrate_report</text>
  <text x="345" y="428" text-anchor="middle" font-size="9.5" fill="#5b21b6">rehydrateFile(.md/.txt/.docx)</text>
  <text x="345" y="444" text-anchor="middle" font-size="9" fill="#7c3aed">gibt nur Metadaten zurück (kein Klarname)</text>

  <!-- ═══════════════════════════════════════════════════════
       PSEUDONYM-MAP
       ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="290" width="140" height="80" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">pseudonym-map</text>
  <text x="100" y="327" text-anchor="middle" font-size="9.5" fill="#92400e">.json (lokal, privat)</text>
  <rect x="40" y="336" width="120" height="26" rx="4" fill="#fef9c3"/>
  <text x="100" y="350" text-anchor="middle" font-size="9" fill="#713f12" font-style="italic">S-0001 ↔ Erika M.</text>
  <text x="100" y="362" text-anchor="middle" font-size="9" fill="#713f12" font-style="italic">S-0002 ↔ Max B.</text>

  <!-- Bericht-Datei -->
  <rect x="30" y="402" width="140" height="70" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Bericht.docx</text>
  <text x="100" y="440" text-anchor="middle" font-size="9.5" fill="#7c3aed">enthält: S-0001, S-0002</text>
  <text x="100" y="456" text-anchor="middle" font-size="9" fill="#8b5cf6">(pseudonymisiert)</text>

  <!-- Bericht-Datei Output -->
  <rect x="30" y="490" width="140" height="50" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="100" y="512" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Bericht_klar.docx</text>
  <text x="100" y="528" text-anchor="middle" font-size="9" fill="#7c3aed">(Klarname, bleibt lokal)</text>

  <!-- ═══════════════════════════════════════════════════════
       KI-MODELL BOX
       ═══════════════════════════════════════════════════════ -->
  <rect x="564" y="80" width="226" height="196" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="677" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">KI-Modell</text>
  <text x="677" y="119" text-anchor="middle" font-size="10" fill="#3b82f6">(Cloud / Claude / GPT)</text>

  <!-- Sieht nur: -->
  <text x="677" y="141" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">Sieht NUR:</text>
  <rect x="575" y="148" width="204" height="18" rx="3" fill="#dcfce7"/>
  <text x="677" y="161" text-anchor="middle" font-size="9.5" fill="#166534">✓ Pseudonyme (S-0001, S-0002 …)</text>
  <rect x="575" y="170" width="204" height="18" rx="3" fill="#dcfce7"/>
  <text x="677" y="183" text-anchor="middle" font-size="9.5" fill="#166534">✓ userids (nur lokal auflösbar)</text>
  <rect x="575" y="192" width="204" height="18" rx="3" fill="#fee2e2"/>
  <text x="677" y="205" text-anchor="middle" font-size="9.5" fill="#dc2626">✗ Klarnamen / E-Mails / Logins</text>
  <rect x="575" y="214" width="204" height="18" rx="3" fill="#fee2e2"/>
  <text x="677" y="227" text-anchor="middle" font-size="9.5" fill="#dc2626">✗ pseudonym-map.json</text>
  <rect x="575" y="236" width="204" height="18" rx="3" fill="#fee2e2"/>
  <text x="677" y="249" text-anchor="middle" font-size="9.5" fill="#dc2626">✗ rehydrierte Dateien</text>

  <!-- ═══════════════════════════════════════════════════════
       PFEILE
       ═══════════════════════════════════════════════════════ -->

  <!-- Moodle → harvestIdentities -->
  <path d="M178,115 L196,145" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="168" y="134" text-anchor="end" font-size="8.5" fill="#9a3412">Rohdaten</text>

  <!-- harvestIdentities → redactResult (vertikal) -->
  <line x1="345" y1="176" x2="345" y2="188" stroke="#4f81e8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- redactResult → MCP Ausgang (Hinweg Pfeil) -->
  <path d="M492,217 L554,180" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="526" y="198" text-anchor="middle" font-size="8.5" fill="#15803d" transform="rotate(-26,526,198)">pseudonymisiert</text>

  <!-- Rückweg: KI → rehydrateText -->
  <path d="M554,230 L492,310" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="516" y="262" text-anchor="middle" font-size="8.5" fill="#6b7280" transform="rotate(56,516,262)">Anweisung mit</text>
  <text x="534" y="278" text-anchor="middle" font-size="8.5" fill="#6b7280">Pseudonym</text>

  <!-- rehydrateText → Moodle (Rückweg) -->
  <path d="M198,317 L178,130" stroke="#ec4899" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowGray)"/>
  <text x="175" y="230" text-anchor="end" font-size="8.5" fill="#9d174d">Klarname</text>

  <!-- pseudonym-map ↔ harvestIdentities/redact -->
  <line x1="170" y1="315" x2="197" y2="190" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowBlue)"/>
  <text x="168" y="260" text-anchor="end" font-size="8.5" fill="#92400e">lesen/</text>
  <text x="168" y="272" text-anchor="end" font-size="8.5" fill="#92400e">schreiben</text>

  <!-- pseudonym-map → rehydrateText -->
  <line x1="170" y1="340" x2="197" y2="317" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- pseudonym-map → rehydrateFile -->
  <line x1="170" y1="355" x2="197" y2="415" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Bericht → rehydrateReport -->
  <line x1="170" y1="437" x2="197" y2="425" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- rehydrateReport → Bericht_klar -->
  <path d="M345,460 L345,480 L170,505" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- rehydrateReport → KI (nur Metadaten) -->
  <path d="M492,425 L677,278" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <text x="610" y="370" font-size="8.5" fill="#7c3aed" transform="rotate(-36,610,370)">nur Metadaten</text>
  <text x="622" y="382" font-size="8.5" fill="#7c3aed" transform="rotate(-36,622,382)">(kein Klarname!)</text>

  <!-- ═══════════════════════════════════════════════════════
       LEGENDE
       ═══════════════════════════════════════════════════════ -->
  <rect x="548" y="304" width="258" height="244" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="677" y="322" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">Legende</text>

  <line x1="562" y1="338" x2="592" y2="338" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="598" y="342" font-size="9.5" fill="#374151">Hinweg: Rohdaten → Server</text>

  <line x1="562" y1="358" x2="592" y2="358" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="598" y="362" font-size="9.5" fill="#374151">Hinweg: pseudonymisiert → Modell</text>

  <line x1="562" y1="378" x2="592" y2="378" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="598" y="382" font-size="9.5" fill="#374151">Rückweg: Modell → Server</text>

  <line x1="562" y1="398" x2="592" y2="398" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="598" y="402" font-size="9.5" fill="#374151">Rückweg: rehydriert → Moodle</text>

  <line x1="562" y1="418" x2="592" y2="418" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="598" y="422" font-size="9.5" fill="#374151">pseudonym-map (lokal)</text>

  <line x1="562" y1="438" x2="592" y2="438" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="598" y="442" font-size="9.5" fill="#374151">Datei-Rehydrierung (lokal)</text>

  <rect x="562" y="454" width="234" height="46" rx="5" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
  <text x="679" y="471" text-anchor="middle" font-size="9" fill="#166534" font-weight="600">Datenschutz-Garantie</text>
  <text x="679" y="485" text-anchor="middle" font-size="9" fill="#166534">Klarnamen verlassen den lokalen</text>
  <text x="679" y="497" text-anchor="middle" font-size="9" fill="#166534">Server-Prozess NIEMALS.</text>

  <!-- Hinweg-Label oben -->
  <text x="560" y="154" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">← Hinweg (Moodle → KI) →</text>
</svg>
